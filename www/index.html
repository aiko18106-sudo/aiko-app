<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIKO</title>
<style>
  html,body{height:100%;margin:0;background:#0f766e;color:#fff;font-family:system-ui,Arial,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .sp{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-bottom:16px}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sp"></div>
    <div style="font-size:20px;font-weight:800;margin-bottom:6px">AIKO</div>
    <div style="font-size:14px;opacity:.9">Đang tải ứng dụng…</div>
    <div style="font-size:12px;opacity:.7;margin-top:14px">Nếu màn hình này đứng lâu, kiểm tra mạng hoặc mở lại app.</div>
  </div>
  <!-- Ghi chú: App thật sẽ tải trang web AIKO từ server.url trong capacitor.config.json.
       Màn hình này chỉ hiện khi chưa vào được web (mất mạng). -->
</body>
</html>
