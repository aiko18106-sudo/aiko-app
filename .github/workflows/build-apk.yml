name: Build AIKO APK

# Bam chay tay tu tab Actions tren GitHub
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai thu vien
        run: npm install

      - name: Tao project Android
        run: npx cap add android

      - name: Them quyen dinh vi nen
        run: node patch-android.js

      - name: Giai ma khoa ky (tu Secret)
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/app/aiko-release.keystore"

      - name: Build va ky APK (release)
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/aiko-release.keystore" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=aiko \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASS }}

      - name: Tai file APK ve (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AIKO-APK
          path: android/app/build/outputs/apk/release/*.apk
